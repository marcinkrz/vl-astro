<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" class="w-full h-auto" fill="none">
  <!-- dashed orbit (DrawSVG entrance, then dash-drift loop); <path> bo MotionPathPlugin nie przyjmuje <circle> -->
  <path class="vlf-orbit" d="M 450 210 A 170 170 0 1 1 449.99 210.001" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="2 12"></path>

  <!-- dashed inner ring, slow rotation loop -->
  <circle class="vlf-ring" cx="280" cy="210" r="118" stroke="var(--muted)" stroke-width="1.5" opacity=".4" stroke-dasharray="70 40 120 60 90 50"></circle>

  <!-- dome, breathing loop -->
  <path class="vlf-dome" d="M 200 330 A 80 80 0 0 1 360 330 Z" fill="var(--foreground)"></path>

  <!-- pulsing dot sitting on the ring -->
  <circle class="vlf-halo" cx="280" cy="92" r="24" fill="var(--muted)"></circle>

  <!-- square riding the orbit (MotionPath), authored at path start (450,210) -->
  <rect class="vlf-square" x="428" y="188" width="44" height="44" fill="var(--foreground)"></rect>

  <!-- blinking asterisk -->
  <g class="vlf-asterisk" stroke="var(--foreground)" stroke-width="2" stroke-linecap="round">
    <path d="M 120 92 V 128"></path>
    <path d="M 102 110 H 138"></path>
    <path d="M 107 97 L 133 123"></path>
    <path d="M 133 97 L 107 123"></path>
  </g>

  <!-- spark burst -->
  <circle class="vlf-spark" cx="452" cy="96" r="8" fill="var(--foreground)"></circle>

  <!-- dashed arc bottom-left -->
  <path class="vlf-arc" d="M 60 340 q 60 40 140 36" stroke="var(--muted)" stroke-width="1.5"></path>

  <!-- half-circle outline top-right -->
  <path class="vlf-halfcircle" d="M 414 54 A 30 30 0 0 1 474 54" stroke="var(--muted)" stroke-width="1.5"></path>

  <!-- small blinking dot -->
  <circle class="vlf-dotsm" cx="132" cy="300" r="5" fill="var(--foreground)"></circle>
</svg>